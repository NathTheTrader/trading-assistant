name: EDGEFLOW browser smoke

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture initial dashboard
        run: mkdir -p /tmp/edgeflow-captures
      - name: Serve frontend
        run: |
          python3 -m http.server 4173 >/tmp/edgeflow-http.log 2>&1 &
          echo $! > /tmp/edgeflow-http.pid
      - name: Exercise independent workspaces
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on("pageerror",e=>errors.push("pageerror: "+e.message));
            page.on("console",m=>{if(m.type()==="error"&&!/status code 403/.test(m.text()))errors.push("console: "+m.text())});
            await page.goto("http://127.0.0.1:4173/index.html",{waitUntil:"domcontentloaded"});
            const visible=()=>page.locator("main > .workspace:not(.hidden)").evaluateAll(xs=>xs.map(x=>x.id));
            const expectVisible=async id=>{
              const v=await visible();
              if(v.length!==1||v[0]!==id)throw new Error("Expected "+id+" visible, got "+JSON.stringify(v));
            };
            await expectVisible("dash");
            if(await page.locator("#dash .connection-card").count()!==0)throw new Error("Dashboard still contains connection cards");
            await page.screenshot({path:"/tmp/edgeflow-futures-dashboard.png",fullPage:true});
            await page.click("#navBotFutures");await expectVisible("bot");
            if(await page.locator("#bot .connection-card").count()!==0)throw new Error("Bot Futures has unexpected connection cards");
            await page.click("#modeCRYPTO");await expectVisible("crypto");
            await page.click("#navDash");await expectVisible("cryptoDash");
            await page.click("#navBotCrypto");await expectVisible("crypto");
            if(await page.locator("#crypto .connection-card").count()!==0)throw new Error("Bot Crypto has unexpected connection cards");
            await page.click("#navDash");await expectVisible("cryptoDash");
            await page.screenshot({path:"/tmp/edgeflow-crypto-dashboard.png",fullPage:true});
            await page.click("#navBotCrypto");await expectVisible("crypto");
            await page.click("#navJournal");await expectVisible("journal");
            const journalTop=await page.locator("#journal").evaluate(el=>el.getBoundingClientRect().top);
            if(journalTop<0||journalTop>100)throw new Error("Journal not positioned at workspace top: "+journalTop);
            await page.click("#modeNQ");await page.click("#navDash");await expectVisible("dash");
            await page.click("#modeCRYPTO");await page.click("#navDash");await expectVisible("cryptoDash");
            await page.click("#navSettings");await expectVisible("settings");
            await page.click("#navJournal");await expectVisible("journal");
            await page.screenshot({path:"/tmp/edgeflow-journal.png",fullPage:true});
            await page.click("#navSettings");await expectVisible("settings");
            await page.screenshot({path:"/tmp/edgeflow-settings.png",fullPage:true});
            if(await page.locator("#settings .connection-card").count()!==3)throw new Error("Settings connection center incomplete");
            await page.click("#navJournal");await expectVisible("journal");
            await page.click("#modeNQ");await expectVisible("journal");
            if(await page.locator("#jMarket").inputValue()!=="FUTURES")throw new Error("Journal did not switch to Futures");
            await page.locator("#jResult").fill("WIN");
            await page.locator("#jR").fill("+2R");
            await page.locator("#jPnL").fill("+200");
            await page.locator("#jContext").fill("Browser smoke test");
            await page.click("#jBefore");
            await page.setInputFiles("#jBefore",{name:"before.png",mimeType:"image/png",buffer:Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=","base64")});
            await page.waitForTimeout(250);
            await page.click("button:has-text('ENREGISTRER')");
            if(await page.locator("#dashTrades").count()!==1)throw new Error("Futures dashboard metric target missing");
            if(await page.locator("#journalMonths").count()!==1)throw new Error("Journal history target missing");
            
            if(errors.length)throw new Error(errors.join("\n"));
            await page.screenshot({path:"/tmp/edgeflow-final.png",fullPage:true});
            console.log("EDGEFLOW browser smoke OK");
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeflow-browser-captures
          path: /tmp/edgeflow-*.png
          if-no-files-found: warn
          retention-days: 2
