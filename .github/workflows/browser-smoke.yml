name: EDGEFLOW browser smoke

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve frontend
        run: |
          python3 -m http.server 4173 >/tmp/edgeflow-http.log 2>&1 &
          echo $! > /tmp/edgeflow-http.pid
      - name: Exercise Edgeflow workspaces
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            await page.route("https://trading-assistant-production.up.railway.app/**",async route=>{
              const u=new URL(route.request().url());
              let body={ok:true},status=200;
              if(u.pathname==="/api/history/ai-context")body={ok:true,sampleSize:0,model:u.searchParams.get("model")||"NQ"};
              else if(u.pathname==="/api/obsidian/status")body={ok:true,imported:false,tradeRecords:0,imageFiles:0,imageAnalyses:0,job:{}};
              else if(u.pathname==="/api/connections/status")body={readOnly:true,tradovate:{connected:false,configured:false},rithmic:{configured:false,connected:false},kcex:{available:true,mode:"screen-observer",apiDirect:false}};
              else if(u.pathname==="/api/tradovate/status")body={connected:false,configured:false};
              else if(u.pathname==="/api/tradovate/events")body=[];
              else if(u.pathname==="/api/chat" && route.request().method()==="POST"){const p=JSON.parse(route.request().postData()||"{}");body={ok:true,text:"Smoke JARVIS "+(p.model||"NQ")};}
              else if(u.pathname==="/api/trades" && route.request().method()==="POST"){status=201;body={ok:true,...JSON.parse(route.request().postData()||"{}")};}
              else if(u.pathname==="/api/trades")body=[];
              await route.fulfill({status,contentType:"application/json",body:JSON.stringify(body),headers:{"access-control-allow-origin":"*"}});
            });
            const errors=[];
            page.on("pageerror",e=>errors.push("pageerror: "+e.message));
            page.on("console",m=>{if(m.type()==="error"&&!/403/.test(m.text()))errors.push("console: "+m.text())});
            await page.goto("http://127.0.0.1:4173/index.html",{waitUntil:"domcontentloaded"});
            await page.waitForTimeout(100);
            if(errors.length)throw new Error("Edgeflow startup errors: "+errors.join("\n"));
            const click=async sel=>page.locator(sel).evaluate(el=>el.click());
            const switchMode=async mode=>{
              const wait=page.waitForURL(url=>new URL(url).searchParams.get("mode")===mode,{waitUntil:"domcontentloaded"});
              await page.locator(mode==="CRYPTO"?"#modeCRYPTO":"#modeNQ").evaluate(el=>el.click());
              await wait;
            };
            const visible=()=>page.locator("main > .workspace:not(.hidden)").evaluateAll(xs=>xs.filter(x=>!x.hidden&&x.style.display!=="none").map(x=>x.id));
            const expectVisible=async id=>{const v=await visible();if(v.length!==1||v[0]!==id)throw new Error("Expected "+id+" visible, got "+JSON.stringify(v));};

            await expectVisible("dash");
            if(await page.locator("#dash").count()!==1)throw new Error("Futures Dashboard missing");

            await click("#navBotFutures");await expectVisible("bot");
            if(await page.locator("#bot #btiming").count()!==1||await page.locator("#bot #bhtf").count()!==1||await page.locator("#bot #bpoi").count()!==1||await page.locator("#bot #bfib").count()!==1||await page.locator("#bot #brb").count()!==1||await page.locator("#bot #brr").count()!==1||await page.locator("#bot #bbacktest").count()!==1)throw new Error("Futures checklist incomplete");

            await switchMode("CRYPTO");await expectVisible("cryptoDash");
            await click("#navDash");await expectVisible("cryptoDash");
            await click("#navBotCrypto");await expectVisible("crypto");
            if(await page.locator("#crypto #cryptoInstrumentBot").count()!==1||await page.locator("#crypto #cDirection").count()!==1||await page.locator("#crypto #cKeyOpen").count()!==1)throw new Error("Crypto Bot controls incomplete");

            await click("#navChat");await expectVisible("chat");
            await page.locator("#chatInput").fill("Test Crypto");
            await page.click("#chat button:has-text('ENVOYER')");
            await page.waitForTimeout(250);
            if(!(await page.locator("#chat .bubble.me").count()===1))throw new Error("JARVIS user bubble missing");
            if(!(await page.locator("#chat .bubble.ai").count()>=2))throw new Error("JARVIS response missing");

            await switchMode("NQ");await click("#navJournal");await expectVisible("journal");
            if(await page.locator("#jDate").count()!==1)throw new Error("Journal date input missing");
            await page.locator("#jDate").fill("2026-09-15");
            await page.locator("#jDate").dispatchEvent("change");
            if((await page.locator("#jDate").inputValue())!=="2026-09-15")throw new Error("Journal date cannot be changed");
            await page.locator("#jDate").fill("2026-09-16");
            await page.locator("#jDate").dispatchEvent("change");
            if((await page.locator("#jDate").inputValue())!=="2026-09-16")throw new Error("Journal date cannot move forward");
            if(!await page.locator("#journalDaySelect").isVisible())throw new Error("Journal day selector missing");
            await page.locator("#jResult").fill("WIN");
            await page.locator("#jR").fill("+2R");
            await page.locator("#jPnL").fill("+200");
            await page.locator("#jContext").fill("Futures date and journal smoke test");
            await page.click("button:has-text('ENREGISTRER')");
            await page.waitForTimeout(350);

            await switchMode("CRYPTO");await click("#navJournal");await expectVisible("journal");
            await page.locator("#jDate").fill("2026-09-16");
            await page.locator("#jDate").dispatchEvent("change");
            await page.locator("#jResult").fill("LOSS");
            await page.locator("#jR").fill("-1R");
            await page.locator("#jPnL").fill("-100");
            await page.locator("#jContext").fill("Crypto journal smoke test");
            await page.click("button:has-text('ENREGISTRER')");
            await page.waitForTimeout(350);

            const stored=await page.evaluate(()=>JSON.parse(localStorage.getItem("journal")||"[]"));
            const split=stored.reduce((a,x)=>(a[x.model]=(a[x.model]||0)+1,a),{});
            if(split.NQ!==1||split.CRYPTO!==1)throw new Error("Journal model split invalid: "+JSON.stringify(split));
            if(!stored.some(x=>x.model==="NQ"&&x.dateISO==="2026-09-16"))throw new Error("Futures selected date not persisted");
            if(!stored.some(x=>x.model==="CRYPTO"&&x.dateISO==="2026-09-16"))throw new Error("Crypto selected date not persisted");

            await switchMode("NQ");await click("#navDash");await expectVisible("dash");
            if((await page.locator("#dashTrades").textContent()).trim()!=="1")throw new Error("Futures Dashboard did not read Futures Journal");
            await switchMode("CRYPTO");await click("#navDash");await expectVisible("cryptoDash");
            if((await page.locator("#cryptoDashTrades").textContent()).trim()!=="0")throw new Error("Futures journal leaked into Crypto Dashboard");
            await switchMode("NQ");await click("#navDash");await expectVisible("dash");
            if((await page.locator("#dashTrades").textContent()).trim()!=="1")throw new Error("Futures Journal missing from Futures Dashboard");

            await click("#navSettings");await expectVisible("settings");
            if(await page.locator("#settings .connection-card").count()!==3)throw new Error("Connection center incomplete");

            await switchMode("NQ");await click("#navBotFutures");await expectVisible("bot");
            await switchMode("CRYPTO");await expectVisible("crypto");
            await switchMode("NQ");await expectVisible("dash");
            await click("#navBotFutures");await expectVisible("bot");
            if(errors.length)throw new Error(errors.join("\n"));
            console.log("EDGEFLOW browser smoke OK");
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
