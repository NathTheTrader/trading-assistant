name: EDGEFLOW browser smoke

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages
        run: |
          set -euo pipefail
          url="https://naththetrader.github.io/trading-assistant/"
          for i in $(seq 1 24); do
            html="$(curl -fsSL --retry 2 --retry-delay 2 "$url" || true)"
            if printf '%s' "$html" | grep -q 'edgeflow-build.*edgeflow-v44'; then
              echo "GitHub Pages is serving EdgeFlow V40."
              exit 0
            fi
            echo "Waiting for Pages deployment ($i/24)..."
            sleep 5
          done
          echo "GitHub Pages did not expose EdgeFlow V40 within the wait window."
          exit 1

      - name: Exercise production GitHub Pages frontend
        run: |
          mkdir -p /tmp/edgeflow-artifacts
          node <<'NODE'
          const { chromium } = require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
            const errors=[];
            page.on("pageerror",e=>errors.push("pageerror: "+e.message));
            page.on("console",m=>{if(m.type()==="error"&&!/403/.test(m.text()))errors.push("console: "+m.text())});

            await page.route("https://trading-assistant-production.up.railway.app/**",async route=>{
              const u=new URL(route.request().url());
              let body={ok:true},status=200;
              if(u.pathname==="/api/tradovate/status") body={ok:true,connected:false,configured:false,accounts:[],cashBalances:[],positions:[],orders:[],recentFills:[]};
              else if(u.pathname==="/api/tradovate/events") body=[];
              else if(u.pathname==="/api/connections/status") body={ok:true,readOnly:true,tradovate:{connected:false,configured:false,accounts:[],cashBalances:[]},rithmic:{configured:false,connected:false},kcex:{available:true,mode:"screen-observer",apiDirect:false}};
              else if(u.pathname==="/api/ai/status") body={ok:true,engine:"JARVIS",provider:"gemini",primaryModel:"gemini-3.5-flash-lite"};
              else if(u.pathname==="/api/ai/chat" && route.request().method()==="POST"){const p=JSON.parse(route.request().postData()||"{}");body={ok:true,text:"Smoke JARVIS "+(p.model||"NQ")};}
              else if(u.pathname==="/api/obsidian/status") body={ok:true,imported:false,tradeRecords:0,imageFiles:0,imageAnalyses:0,job:{}};
              else if(u.pathname==="/api/history/ai-context") body={ok:true,model:u.searchParams.get("model")||"NQ",sampleSize:0};
              else if(u.pathname==="/api/trades") body=[];
              else if(u.pathname==="/api/jarvis/journal" && route.request().method()==="POST") body={ok:true,text:"Smoke image analysis",confidence:90};
              await route.fulfill({status,contentType:"application/json",body:JSON.stringify(body),headers:{"access-control-allow-origin":"*","cache-control":"no-store"}});
            });

            const base="https://naththetrader.github.io/trading-assistant/";
            const visible=()=>page.locator(".app-shell .workspace").count();
            const assert=async(cond,msg)=>{if(!cond)throw new Error(msg)};
            const snapshot=async(label)=>{
              const safe=label.replace(/[^a-z0-9_-]/gi,"-").toLowerCase();
              await page.screenshot({path:"/tmp/edgeflow-artifacts/"+safe+".png",fullPage:true}).catch(()=>{});
              require("fs").writeFileSync("/tmp/edgeflow-artifacts/"+safe+".html",await page.content());
              console.log("SNAPSHOT",label,"URL",page.url());
              console.log("BODY", (await page.locator("body").innerText()).slice(0,5000));
            };
            const noFatal=async(label)=>{if(await page.locator(".fatal").count()){await snapshot(label+"-fatal");throw new Error("Fatal screen: "+label)}};

            await page.goto(base,{waitUntil:"domcontentloaded"});
            await page.waitForSelector(".env.red");
            await page.waitForSelector(".env.blue");
            await assert(await page.locator(".fatal").count()===0,"Fatal screen on landing page");

            await page.locator(".env.red").click();
            await page.waitForURL(url=>new URL(url).searchParams.get("mode")==="NQ");
            await page.waitForSelector(".dash");
            await noFatal("futures-dashboard");
            await assert(await page.locator(".account-state").count()===1,"Futures account state missing");
            await assert((await page.locator(".dash").innerText()).includes("FUTURES"),"Futures dashboard text missing");
            await assert(!(await page.locator(".fatal").count()),"Fatal screen after entering Futures");

            console.log("NAV BUTTONS",await page.locator("nav button").allTextContents());
            await page.locator("nav button").filter({hasText:"Trades"}).first().click({force:true});
            await page.waitForTimeout(250);
            await noFatal("futures-trades");
            await snapshot("futures-trades-debug");
            await page.waitForSelector(".filters",{timeout:5000});
            await assert((await page.locator("body").innerText()).includes("TRADOVATE"),"Futures provider not present in Trades");

            await page.locator("nav button").filter({hasText:"AI Assistant"}).click();
            await page.waitForSelector("#aiInput");
            await page.locator("#aiInput").fill("Smoke test Futures");
            await page.locator("#aiSend").click();
            await page.waitForFunction(()=>document.querySelector("#aiMessages")?.innerText.includes("Smoke JARVIS NQ"),null,{timeout:10000});
            await assert((await page.locator(".ai-messages").innerText()).includes("Smoke JARVIS NQ"),"Futures JARVIS response missing");

            await page.goto(base+"?mode=CRYPTO&view=overview",{waitUntil:"domcontentloaded"});
            await page.waitForSelector(".dash");
            await noFatal("crypto-dashboard");
            const cryptoText=await page.locator(".dash").innerText();
            await assert(cryptoText.includes("CRYPTO"),"Crypto dashboard text missing");
            await assert(cryptoText.includes("KCEX · CRYPTO FUTURES"),"KCEX Crypto Futures provider missing");
            await assert(!cryptoText.includes("TRADOVATE"),"Tradovate leaked into Crypto dashboard");
            await assert(!cryptoText.includes("RITHMIC"),"Rithmic leaked into Crypto dashboard");

            await page.locator("nav button").filter({hasText:"Connections"}).first().click({force:true});
            await page.waitForTimeout(250);
            await noFatal("crypto-connections");
            await page.waitForSelector(".connection-live",{timeout:5000});
            const cryptoConn=await page.locator(".workspace").innerText();
            await assert(cryptoConn.includes("KCEX · CRYPTO FUTURES"),"Crypto connection center missing KCEX");
            await assert(!cryptoConn.includes("TRADOVATE"),"Tradovate leaked into Crypto connections");
            await assert(!cryptoConn.includes("RITHMIC"),"Rithmic leaked into Crypto connections");

            await page.locator("nav button").filter({hasText:"AI Assistant"}).first().click({force:true});
            await page.waitForTimeout(250);
            await noFatal("crypto-ai");
            await page.locator("#aiInput").fill("Smoke test Crypto");

            // Full workspace sweep: both environments must render every page without the fatal screen.
            for(const mode of ["NQ","CRYPTO"]){
              for(const view of ["overview","trades","performance","ai","journal","analytics","backtests","connections","settings"]){
                await page.goto(base+"?mode="+mode+"&view="+view,{waitUntil:"domcontentloaded"});
                await page.waitForTimeout(100);
                await noFatal(mode+"-"+view);
                if(view==="overview"){
                  await assert(await page.locator(".dash").count()===1,mode+" overview dashboard missing");
                }else{
                  await assert(await page.locator(".page-title").count()===1,mode+" "+view+" page title missing");
                }
              }
              await page.goto(base+"?mode="+mode+"&view=connections",{waitUntil:"domcontentloaded"});
              await noFatal(mode+"-connections-final");
              const txt=await page.locator(".workspace").innerText();
              if(mode==="NQ") await assert(txt.includes("TRADOVATE"),"Futures Connections missing Tradovate");
              if(mode==="CRYPTO") await assert(txt.includes("KCEX · CRYPTO FUTURES"),"Crypto Connections missing KCEX");
            }


            await page.locator("#aiSend").click();
            await page.waitForFunction(()=>document.querySelector("#aiMessages")?.innerText.includes("Smoke JARVIS CRYPTO"),null,{timeout:10000});
            await assert((await page.locator(".ai-messages").innerText()).includes("Smoke JARVIS CRYPTO"),"Crypto JARVIS response missing");

            await page.screenshot({path:"/tmp/edgeflow-artifacts/edgeflow-production-final.png",fullPage:true});
            require("fs").writeFileSync("/tmp/edgeflow-artifacts/edgeflow-production.html",await page.content());

            if(errors.length)throw new Error("Browser errors:\n"+errors.join("\n"));
            await browser.close();
            console.log("EDGEFLOW production browser smoke OK");
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload production browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeflow-production-browser
          path: /tmp/edgeflow-artifacts
          if-no-files-found: ignore
