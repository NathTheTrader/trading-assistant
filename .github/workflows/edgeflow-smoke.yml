name: Edgeflow smoke test

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway backend
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5             https://trading-assistant-production.up.railway.app/health
      - name: Check production API contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          base="https://trading-assistant-production.up.railway.app"
          origin="https://naththetrader.github.io"
          def get(path):
              req=urllib.request.Request(base+path,headers={"Origin":origin,"Accept":"application/json","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=200: raise RuntimeError(f"{path}: HTTP {r.status}")
                  data=json.load(r)
              print(path, "OK", sorted(data.keys()) if isinstance(data,dict) else type(data).__name__)
              return data
          ai=get("/api/ai/status")
          assert isinstance(ai,dict) and ai.get("ok") is True, ai
          assert any(k in ai for k in ("provider","primaryModel","aiPrimaryModel")), ai
          voice=get("/api/voice/status")
          assert isinstance(voice,dict) and voice.get("ok") is True, voice
          connections=get("/api/connections/status")
          assert isinstance(connections,dict) and connections.get("readOnly") is True, connections
          assert all(k in connections for k in ("tradovate","rithmic","kcex")), connections
          for model in ("NQ","CRYPTO"):
              ctx=get("/api/history/ai-context?model="+model)
              assert ctx.get("model")==model, ctx
              obs=get("/api/obsidian/status?model="+model)
              assert obs.get("model")==model, obs
              trades=get("/api/trades?model="+model)
              assert isinstance(trades,list), trades
          print("Production API contracts OK")
          PY
      - name: Check GitHub Pages frontend
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5             https://naththetrader.github.io/trading-assistant/
