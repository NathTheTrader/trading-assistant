name: Trading Assistant CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend syntax
        run: node --check backend/server.js
      - name: Check frontend inline JavaScript
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          const scripts=[...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)]
            .filter(m=>!/<script[^>]*\\bsrc=/i.test(m[0]));
          if(!scripts.length) throw new Error("No inline script found");
          fs.writeFileSync("/tmp/index-inline.js",scripts.map(m=>m[1]).join("\n"));
          NODE
          node --check /tmp/index-inline.js
      - name: Check Edgeflow invariants
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const html=fs.readFileSync("index.html","utf8");
          const backend=fs.readFileSync("backend/server.js","utf8");
          const voice=fs.readFileSync("voice-coach.js","utf8");
          const fail=(m)=>{throw new Error(m)};
          if(html.includes("async async function")) fail("Invalid duplicate async syntax remains");
          if(html.includes("TradeSea")||backend.includes("TradeSea")) fail("Removed broker TradeSea still referenced");
          if((html.match(/id="revenge"/g)||[]).length!==1) fail("Futures revenge checkbox invariant failed");
          if(!html.includes('data-mode="NQ"')||!html.includes('data-mode="CRYPTO"')) fail("Futures/Crypto mode separation missing");
          if(!html.includes('id="connTradovate"')||!html.includes('id="connRithmic"')||!html.includes('id="connKcex"')) fail("Connection center IDs missing");
          if(!backend.includes('OPENROUTER_DAILY_REQUEST_LIMIT')) fail("AI request limit must be configurable, not hard-coded");
          if(!backend.includes('status !== 429')) fail("AI transient 429 retry missing");
          if(!html.includes('function edgeflowAutoUpdate()')) fail("Frontend auto-update watcher missing");
          if(!html.includes('classList.add("hidden")')) fail("Stable class-based workspace router missing");
          if(!html.includes('document.querySelectorAll("main>.workspace")')) fail("Workspace isolation selector missing");
          if(!voice.includes("trading-assistant-production.up.railway.app")) fail("Voice backend default missing");
          const sections=[...html.matchAll(/<section id="([^"]+)"/g)].map(m=>m[1]);
          for(const id of ["models","dash","cryptoDash","bot","crypto","review","cryptoReview","chat","journal","settings"]) if(!sections.includes(id)) fail("Missing workspace: "+id);
          if(new Set(sections).size!==sections.length) fail("Duplicate workspace IDs");
          if((html.match(/<style\b/gi)||[]).length!==1 || !html.includes("<style>")) fail("Expected one stylesheet block");
          if(html.indexOf("<style>")>html.indexOf("</head>")) fail("Stylesheet must be in head");
          if(!html.includes('<script src="./voice-coach.js"></script>')) fail("Voice script tag malformed");
          if(!html.includes('id="cryptoBotOutput"')||!html.includes('id="cryptoDashTrades"')||!html.includes('id="cryptoReviewResult"')) fail("Crypto workspace outputs missing");
          if(!html.includes('id="aiEngineStatus"')||!html.includes('id="aiOptimizationOutput"')) fail("JARVIS intelligence panel missing");
          if(!html.includes('function refreshAIEngineStatus')||!html.includes('function runDailyOptimization')||!html.includes('function askCoachQuestion')) fail("JARVIS intelligence functions missing");
          if(!backend.includes('AI_ENGINE_VERSION')||!backend.includes('MODEL_CONTRACTS')||!backend.includes('app.get("/api/ai/status"')) fail("JARVIS AI engine contract missing");
          if(!backend.includes('AI_DAILY_QUOTA')||!backend.includes('FALLBACK_MODELS')) fail("JARVIS AI error/fallback handling missing");
          if(!html.includes("let rithmicScreenStream=null")) fail("Rithmic screen observer state missing");
          if(!html.includes("function showActiveDashboard")) fail("Independent dashboard routing missing");
          if(!html.includes("s.hidden=true")||!html.includes("target.hidden=false")) fail("Deterministic workspace hiding missing");
          if(!html.includes('id="crypto"')||!html.includes('id="cryptoReview"')) fail("Independent Crypto workspaces missing");
          if(html.includes("app[data-view]")) fail("Legacy data-view router still present");
          console.log("Edgeflow invariants OK");
          NODE
