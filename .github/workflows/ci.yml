name: Trading Assistant CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend syntax
        run: node --check backend/server.js
      - name: Check frontend JavaScript
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const app=fs.readFileSync("edgeflow-v3/app.js","utf8");
          new Function(app);
          const html=fs.readFileSync("index.html","utf8");
          for(const ref of ["./edgeflow-v3/styles.css?v=44","./edgeflow-v3/reference.css?v=44","./edgeflow-v3/app.js?v=44"]){
            if(!html.includes(ref)) throw new Error("Missing frontend asset reference: "+ref);
          }
          console.log("Frontend JavaScript and asset references OK");
          NODE
      - name: Check EdgeFlow environment invariants
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const app=fs.readFileSync("edgeflow-v3/app.js","utf8");
          const backend=fs.readFileSync("backend/server.js","utf8");
          const css=fs.readFileSync("edgeflow-v3/reference.css","utf8");
          const html=fs.readFileSync("index.html","utf8");
          const fail=m=>{throw new Error(m)};
          if(!app.includes('NQ:{label:"FUTURES"')) fail("Futures model definition missing");
          if(!app.includes('CRYPTO:{label:"CRYPTO"')) fail("Crypto model definition missing");
          if(!app.includes('connections:["Tradovate","Rithmic"]')) fail("Futures broker isolation missing");
          if(!app.includes('connections:["KCEX"]')) fail("Crypto KCEX isolation missing");
          if(!app.includes('provider=crypto()?"KCEX · CRYPTO FUTURES":"TRADOVATE"')) fail("Provider routing missing");
          if(!app.includes('model=normalizeModel(req.body.model)') && !backend.includes('app.post("/api/ai/chat"')) fail("JARVIS chat contract missing");
          if(!backend.includes('app.post("/api/ai/chat"')) fail("JARVIS chat endpoint missing");
          if(!backend.includes('app.post("/api/detect-screen-trade"')) fail("KCEX/Rithmic screen observer endpoint missing");
          if(!backend.includes('app.get("/api/tradovate/status"')) fail("Tradovate status endpoint missing");
          if(!app.includes('function refreshTradovateDashboard')) fail("Tradovate refresh missing");
          if(!app.includes('function sessionState')) fail("Futures session clock missing");
          if(!app.includes('state.mode==="NQ"')||!app.includes('state.mode==="CRYPTO"')) fail("Mode isolation checks missing");
          if(!app.includes('function instrumentCardsZero')) fail("Disconnected dashboard empty state missing");
          if(css.includes("filter:blur") && css.includes(".app-page:before")) console.log("Note: scoped visual blur rules remain elsewhere; production background override is V40.");
          if(!html.includes('edgeflow-build')||!html.includes('edgeflow-v44')) fail("Current build marker missing");
          console.log("EdgeFlow invariants OK");
          NODE
